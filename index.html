<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="build/icon.ico">
    <title>Phone Book</title>
</head>
<body>

    <div class="search-container">  
        <input id="searchInput" type="text"  placeholder="جست و جو کنید ." aria-label="جست و جو">
        <div id="searchResult" class="search-result"></div>
    </div>
    <div id="Error"></div>
    <fieldset id="phonebox">
      <legend> دفترچه تلفن </legend>
       <div id="information">
        <table class="table">
            <tbody id="tableBody">
               <tr>
                   <td>نام و نام خانوادگی : </td>
                   <td><input type="text" name="user" class="UserName"></td>
                   <td class="userOutput"> </td>
               </tr>
               <tr>
                   <td style="position:fixed">شماره تماس : </td>
                   <td>
                     <div class="phonInputsRow">
                        <div class="phone-row">
                            <input type="text" name="phon" class="phone">
                            <button type="button" class="add-phone"> + </button>
                        </div>
                     </div>
                   </td>
                   <td class="phonOutput"> </td>
               </tr>
               <tr>
                   <td>نام مجموعه : </td>
                   <td><input type="text" name="company" class="company"></td>
                   <td class="companyOutput"> </td>
               </tr>
             </tbody>
        </table>
        <div id="buttons">
           <button class="save"> ثبت </button>
           <button class="edit"> ویرایش </button>
           <button class="delete"> حذف</button>
           <button class="cancel"> انصراف</button>
           
        </div>
       </div>
    </fieldset>

</body>
</html>
